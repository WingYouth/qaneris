services:
  qaneris:
    build: .
    ports:
      - "8000:8000"
    environment:
      QANERIS_CATALOG: /data/qaneris.db
      QANERIS_GRAPH_STORE: neo4j
      QANERIS_NEO4J_URI: bolt://neo4j:7687
      QANERIS_NEO4J_USERNAME: ${QANERIS_NEO4J_USERNAME:-neo4j}
      QANERIS_NEO4J_PASSWORD: ${QANERIS_NEO4J_PASSWORD}
      QANERIS_NEO4J_DATABASE: ${QANERIS_NEO4J_DATABASE:-neo4j}
    volumes:
      - qaneris-catalog:/data
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${QANERIS_NEO4J_USERNAME:-neo4j}/${QANERIS_NEO4J_PASSWORD}
    volumes:
      - qaneris-neo4j:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:7474"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  qaneris-catalog:
  qaneris-neo4j:
