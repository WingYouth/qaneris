services:
  smartdata:
    build: .
    ports:
      - "8000:8000"
    environment:
      SMARTDATA_CATALOG: /data/smartdata.db
      SMARTDATA_GRAPH_STORE: neo4j
      SMARTDATA_NEO4J_URI: bolt://neo4j:7687
      SMARTDATA_NEO4J_USERNAME: ${SMARTDATA_NEO4J_USERNAME:-neo4j}
      SMARTDATA_NEO4J_PASSWORD: ${SMARTDATA_NEO4J_PASSWORD}
      SMARTDATA_NEO4J_DATABASE: ${SMARTDATA_NEO4J_DATABASE:-neo4j}
    volumes:
      - smartdata-catalog:/data
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${SMARTDATA_NEO4J_USERNAME:-neo4j}/${SMARTDATA_NEO4J_PASSWORD}
    volumes:
      - smartdata-neo4j:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:7474"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  smartdata-catalog:
  smartdata-neo4j:
