[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qaneris-platform"
version = "0.1.0"
description = "Enterprise multi-source conversational analytics platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiyallm>=0.1.3",
  "cryptography>=43,<48",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mcp>=1.2,<2",
  "openpyxl>=3.1,<4",
  "pydantic>=2.9,<3",
  "pymongo>=4.18.1",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]
# The interactive session (`qaneris shell`) is the only surface that needs these. They stay
# optional so the core install, the API, the MCP server and every one-shot command keep working
# without them; `shell` reports the exact install command when they are absent.
shell = ["prompt_toolkit>=3.0,<4", "rich>=13,<16"]
sql = [
  "sqlalchemy>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "pymysql>=1.1,<2",
  "oracledb>=2,<4",
  "pyodbc>=5,<6",
  "clickhouse-connect>=0.8,<1",
  "snowflake-sqlalchemy>=1.7,<2",
  "sqlalchemy-bigquery>=1.12,<2",
]
redis = ["redis>=5,<7"]
mongodb = ["pymongo>=4.10,<5"]
cassandra = ["cassandra-driver>=3.29,<4"]
hbase = ["happybase>=1.2,<2"]
neo4j = ["neo4j>=5,<7"]
influxdb = ["influxdb-client>=1.48,<2"]
search = ["elasticsearch>=8,<10", "opensearch-py>=2.8,<4"]
milvus = ["pymilvus>=2.5,<3"]
qdrant = ["qdrant-client>=1.13,<2"]

[project.scripts]
qaneris = "qaneris.cli.main:main"
qaneris-api = "qaneris.interfaces.api.app:main"
qaneris-mcp = "qaneris.interfaces.mcp.server:main"
qaneris-scan = "qaneris.cli.scan:main"
qaneris-shell = "qaneris.cli.shell:main"

[tool.hatch.build.targets.wheel]
packages = ["qaneris"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
